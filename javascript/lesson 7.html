       function tipRate() {
        let cost = parseFloat(prompt("What was the cost of your meal?"));

        let tip = parseInt(prompt("What do you want your tip precent to be?"));

        alert("Your tip is $" + calc(cost, tip) + ".");
       }

       function calc(cost, tip) {
        let percent = tip/100;
        let finalTip = percent*cost;

      

        return finalTip;
        
       
       }
